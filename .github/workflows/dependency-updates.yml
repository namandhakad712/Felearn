name: Dependency Updates

on:
  schedule:
    # Run every Monday at 9 AM UTC
    - cron: '0 9 * * 1'
  workflow_dispatch: # Allow manual triggering

jobs:
  update-dependencies:
    name: Update Dependencies
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
        
    - name: Install dependencies
      run: npm ci
      
    - name: Check for outdated packages
      run: |
        npm outdated --json > outdated.json || true
        cat outdated.json
        
    - name: Update patch and minor versions
      run: |
        npm update --save
        npm update --save-dev
        
    - name: Run tests after update
      run: npm test -- --watchAll=false
      
    - name: Check if there are changes
      id: changes
      run: |
        if git diff --quiet package-lock.json; then
          echo "has-changes=false" >> $GITHUB_OUTPUT
        else
          echo "has-changes=true" >> $GITHUB_OUTPUT
        fi
        
    - name: Create Pull Request
      if: steps.changes.outputs.has-changes == 'true'
      uses: peter-evans/create-pull-request@v5
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        commit-message: 'chore: update dependencies'
        title: 'chore: automated dependency updates'
        body: |
          ## Automated Dependency Updates
          
          This PR contains automated updates to patch and minor versions of dependencies.
          
          ### Changes
          - Updated npm dependencies to latest patch/minor versions
          - All tests are passing
          
          ### Review Checklist
          - [ ] Review the updated dependencies
          - [ ] Ensure all tests pass
          - [ ] Check for any breaking changes in changelogs
          
          This PR was created automatically by the dependency update workflow.
        branch: chore/dependency-updates
        delete-branch: true
        
    - name: Enable auto-merge for dependency updates
      if: steps.changes.outputs.has-changes == 'true'
      run: |
        gh pr merge --auto --squash chore/dependency-updates
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  security-updates:
    name: Security Updates
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
        
    - name: Install dependencies
      run: npm ci
      
    - name: Run security audit
      run: npm audit --audit-level=moderate
      
    - name: Fix security vulnerabilities
      run: npm audit fix
      
    - name: Run tests after security fixes
      run: npm test -- --watchAll=false
      
    - name: Check if there are security fixes
      id: security-changes
      run: |
        if git diff --quiet package-lock.json; then
          echo "has-security-changes=false" >> $GITHUB_OUTPUT
        else
          echo "has-security-changes=true" >> $GITHUB_OUTPUT
        fi
        
    - name: Create Security Fix Pull Request
      if: steps.security-changes.outputs.has-security-changes == 'true'
      uses: peter-evans/create-pull-request@v5
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        commit-message: 'fix: security vulnerability updates'
        title: '🔒 Security: automated vulnerability fixes'
        body: |
          ## Automated Security Fixes
          
          This PR contains automated fixes for security vulnerabilities found by npm audit.
          
          ### Security Updates
          - Applied `npm audit fix` to resolve security issues
          - All tests are passing after the fixes
          
          ### ⚠️ Important
          This PR should be reviewed and merged as soon as possible to address security vulnerabilities.
          
          ### Review Checklist
          - [ ] Review the security fixes applied
          - [ ] Ensure all tests pass
          - [ ] Verify application functionality
          
          This PR was created automatically by the security update workflow.
        branch: security/vulnerability-fixes
        delete-branch: true
        labels: security,automated
        
    - name: Request review for security PR
      if: steps.security-changes.outputs.has-security-changes == 'true'
      run: |
        gh pr review --approve security/vulnerability-fixes
        gh pr merge --auto --squash security/vulnerability-fixes
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  renovate-config:
    name: Renovate Configuration Check
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Check if Renovate config exists
      id: renovate-check
      run: |
        if [ -f "renovate.json" ] || [ -f ".renovaterc.json" ] || [ -f ".github/renovate.json" ]; then
          echo "renovate-exists=true" >> $GITHUB_OUTPUT
        else
          echo "renovate-exists=false" >> $GITHUB_OUTPUT
        fi
        
    - name: Create Renovate configuration
      if: steps.renovate-check.outputs.renovate-exists == 'false'
      run: |
        cat > renovate.json << 'EOF'
        {
          "$schema": "https://docs.renovatebot.com/renovate-schema.json",
          "extends": [
            "config:base",
            ":dependencyDashboard",
            ":semanticCommits",
            ":separatePatchReleases"
          ],
          "schedule": ["before 10am on monday"],
          "timezone": "UTC",
          "labels": ["dependencies"],
          "assignees": ["@me"],
          "reviewers": ["@me"],
          "packageRules": [
            {
              "matchDepTypes": ["devDependencies"],
              "automerge": true,
              "automergeType": "pr",
              "platformAutomerge": true
            },
            {
              "matchPackagePatterns": ["^@types/"],
              "automerge": true,
              "automergeType": "pr",
              "platformAutomerge": true
            },
            {
              "matchUpdateTypes": ["patch"],
              "automerge": true,
              "automergeType": "pr",
              "platformAutomerge": true
            }
          ],
          "vulnerabilityAlerts": {
            "enabled": true,
            "schedule": ["at any time"]
          }
        }
        EOF
        
    - name: Create PR for Renovate config
      if: steps.renovate-check.outputs.renovate-exists == 'false'
      uses: peter-evans/create-pull-request@v5
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        commit-message: 'chore: add renovate configuration'
        title: 'chore: add Renovate bot configuration'
        body: |
          ## Add Renovate Configuration
          
          This PR adds a Renovate configuration to automate dependency updates.
          
          ### Features
          - Automatic dependency updates
          - Security vulnerability alerts
          - Auto-merge for patch updates and dev dependencies
          - Scheduled updates on Mondays
          
          ### Next Steps
          After merging this PR, enable Renovate bot in the repository settings.
          
        branch: chore/add-renovate-config
        delete-branch: true