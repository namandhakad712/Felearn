name: Release Management

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g., 1.0.0)'
        required: true
        type: string
      prerelease:
        description: 'Is this a pre-release?'
        required: false
        type: boolean
        default: false

jobs:
  validate-release:
    name: Validate Release
    runs-on: ubuntu-latest
    
    outputs:
      version: ${{ steps.version.outputs.version }}
      is-prerelease: ${{ steps.version.outputs.is-prerelease }}
      
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Determine version
      id: version
      run: |
        if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
          VERSION="${{ github.event.inputs.version }}"
          IS_PRERELEASE="${{ github.event.inputs.prerelease }}"
        else
          VERSION="${GITHUB_REF#refs/tags/v}"
          if [[ "$VERSION" == *"-"* ]]; then
            IS_PRERELEASE="true"
          else
            IS_PRERELEASE="false"
          fi
        fi
        
        echo "version=$VERSION" >> $GITHUB_OUTPUT
        echo "is-prerelease=$IS_PRERELEASE" >> $GITHUB_OUTPUT
        echo "Version: $VERSION"
        echo "Pre-release: $IS_PRERELEASE"
        
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
        
    - name: Install dependencies
      run: npm ci
      
    - name: Run tests
      run: npm test -- --coverage --watchAll=false
      
    - name: Build application
      run: npm run build
      
    - name: Validate package.json version
      run: |
        PACKAGE_VERSION=$(node -p "require('./package.json').version")
        if [ "$PACKAGE_VERSION" != "${{ steps.version.outputs.version }}" ]; then
          echo "❌ Package.json version ($PACKAGE_VERSION) doesn't match release version (${{ steps.version.outputs.version }})"
          exit 1
        fi
        echo "✅ Package.json version matches release version"

  create-release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: validate-release
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
        
    - name: Install dependencies
      run: npm ci
      
    - name: Build application
      run: npm run build
      
    - name: Generate changelog
      id: changelog
      run: |
        # Get the previous tag
        PREVIOUS_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
        
        if [ -z "$PREVIOUS_TAG" ]; then
          echo "## Changes" > CHANGELOG.md
          echo "Initial release" >> CHANGELOG.md
        else
          echo "## Changes since $PREVIOUS_TAG" > CHANGELOG.md
          echo "" >> CHANGELOG.md
          
          # Get commits since last tag
          git log --pretty=format:"- %s (%h)" $PREVIOUS_TAG..HEAD >> CHANGELOG.md
        fi
        
        # Read changelog content
        CHANGELOG_CONTENT=$(cat CHANGELOG.md)
        echo "changelog<<EOF" >> $GITHUB_OUTPUT
        echo "$CHANGELOG_CONTENT" >> $GITHUB_OUTPUT
        echo "EOF" >> $GITHUB_OUTPUT
        
    - name: Create release archive
      run: |
        mkdir -p release-assets
        
        # Create source archive
        tar -czf release-assets/source-v${{ needs.validate-release.outputs.version }}.tar.gz \
          --exclude='.git' \
          --exclude='node_modules' \
          --exclude='release-assets' \
          .
          
        # Create build archive
        tar -czf release-assets/build-v${{ needs.validate-release.outputs.version }}.tar.gz \
          -C dist .
          
    - name: Create GitHub Release
      uses: actions/create-release@v1
      id: create_release
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: v${{ needs.validate-release.outputs.version }}
        release_name: Release v${{ needs.validate-release.outputs.version }}
        body: |
          # AI Storytelling Platform v${{ needs.validate-release.outputs.version }}
          
          ${{ steps.changelog.outputs.changelog }}
          
          ## Installation
          
          ### Frontend Deployment
          1. Download the build archive
          2. Deploy to your hosting provider (Vercel recommended)
          3. Configure environment variables
          
          ### Appwrite Functions
          1. Download the source archive
          2. Extract and navigate to the functions directory
          3. Deploy using the Appwrite CLI
          
          ## Documentation
          - [Deployment Guide](https://github.com/${{ github.repository }}/blob/main/DEPLOYMENT.md)
          - [Functions Deployment](https://github.com/${{ github.repository }}/blob/main/FUNCTIONS_DEPLOYMENT.md)
          
          ## Support
          If you encounter any issues, please [create an issue](https://github.com/${{ github.repository }}/issues/new).
          
        draft: false
        prerelease: ${{ needs.validate-release.outputs.is-prerelease == 'true' }}
        
    - name: Upload source archive
      uses: actions/upload-release-asset@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        upload_url: ${{ steps.create_release.outputs.upload_url }}
        asset_path: ./release-assets/source-v${{ needs.validate-release.outputs.version }}.tar.gz
        asset_name: source-v${{ needs.validate-release.outputs.version }}.tar.gz
        asset_content_type: application/gzip
        
    - name: Upload build archive
      uses: actions/upload-release-asset@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        upload_url: ${{ steps.create_release.outputs.upload_url }}
        asset_path: ./release-assets/build-v${{ needs.validate-release.outputs.version }}.tar.gz
        asset_name: build-v${{ needs.validate-release.outputs.version }}.tar.gz
        asset_content_type: application/gzip

  deploy-release:
    name: Deploy Release
    runs-on: ubuntu-latest
    needs: [validate-release, create-release]
    if: needs.validate-release.outputs.is-prerelease == 'false'
    environment: production
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
        
    - name: Install Vercel CLI
      run: npm install --global vercel@latest
      
    - name: Pull Vercel Environment Information
      run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
      
    - name: Build Project Artifacts
      run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}
      
    - name: Deploy to Vercel
      id: deploy
      run: |
        url=$(vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }})
        echo "production-url=$url" >> $GITHUB_OUTPUT
        
    - name: Deploy Appwrite Functions
      run: |
        npm ci
        npm install -g appwrite-cli
        appwrite client --endpoint ${{ secrets.APPWRITE_ENDPOINT }}
        appwrite login --email ${{ secrets.APPWRITE_EMAIL }} --password ${{ secrets.APPWRITE_PASSWORD }}
        npm run deploy:functions
      env:
        APPWRITE_PROJECT_ID: ${{ secrets.APPWRITE_PROJECT_ID }}
        APPWRITE_API_KEY: ${{ secrets.APPWRITE_API_KEY }}
        
    - name: Update release with deployment info
      uses: actions/github-script@v7
      with:
        script: |
          const { data: release } = await github.rest.repos.getReleaseByTag({
            owner: context.repo.owner,
            repo: context.repo.repo,
            tag: 'v${{ needs.validate-release.outputs.version }}'
          });
          
          const updatedBody = release.body + `
          
          ## Deployment
          
          ✅ **Production Deployment**: ${{ steps.deploy.outputs.production-url }}
          ✅ **Appwrite Functions**: Deployed successfully
          
          Deployed on: ${new Date().toISOString()}
          `;
          
          await github.rest.repos.updateRelease({
            owner: context.repo.owner,
            repo: context.repo.repo,
            release_id: release.id,
            body: updatedBody
          });

  notify-release:
    name: Notify Release
    runs-on: ubuntu-latest
    needs: [validate-release, create-release, deploy-release]
    if: always() && needs.create-release.result == 'success'
    
    steps:
    - name: Send release notification
      uses: actions/github-script@v7
      with:
        script: |
          const version = '${{ needs.validate-release.outputs.version }}';
          const isPrerelease = '${{ needs.validate-release.outputs.is-prerelease }}' === 'true';
          const deploySuccess = '${{ needs.deploy-release.result }}' === 'success';
          
          let message = `🚀 **${isPrerelease ? 'Pre-release' : 'Release'} v${version}** has been created!`;
          
          if (!isPrerelease) {
            if (deploySuccess) {
              message += '\n✅ Successfully deployed to production';
            } else {
              message += '\n❌ Deployment failed - please check the logs';
            }
          }
          
          // Create a discussion or issue for the release
          await github.rest.repos.createCommitStatus({
            owner: context.repo.owner,
            repo: context.repo.repo,
            sha: context.sha,
            state: deploySuccess ? 'success' : 'failure',
            context: 'release/deployment',
            description: `Release v${version} ${deploySuccess ? 'deployed successfully' : 'deployment failed'}`
          });
          
          console.log(message);