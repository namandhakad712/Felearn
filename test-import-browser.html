<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Test Import Map</title>
  <script type="importmap">
  {
    "imports": {
      "@google/genai": "https://esm.sh/@google/genai@^0.7.0",
      "marked": "https://esm.sh/marked@^15.0.7"
    }
  }
  </script>
</head>
<body>
  <h1>Testing Import Map</h1>
  <div id="output"></div>

  <script type="module">
    // Test importing from the CDN
    try {
      const module = await import('@google/genai');
      const { GoogleGenAI, Modality } = module;
      
      document.getElementById('output').innerHTML = `
        <p style="color: green">Successfully imported from @google/genai</p>
        <p>GoogleGenAI: ${typeof GoogleGenAI}</p>
        <p>Modality: ${typeof Modality}</p>
        <p>Available exports: ${Object.keys(module).join(', ')}</p>
      `;
    } catch (error) {
      document.getElementById('output').innerHTML = `
        <p style="color: red">Error importing from @google/genai: ${error.message}</p>
      `;
    }
  </script>
</body>
</html>
